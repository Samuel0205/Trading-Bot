<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BREACH PROTOCOL</title>
<style>
  :root{
    --hud:#0b0f14; --line:#243447; --hp:#ff3b3b; --armor:#37b6ff; --ammo:#ffcf3b;
    --accent:#ff6a2b; --ink:#e9f1fb; --dim:#8ba1ba;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{height:100%;overflow:hidden;background:#05070b;color:var(--ink);
    font-family:"Rajdhani","Segoe UI",Roboto,system-ui,sans-serif;}
  #stage{position:fixed;inset:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:none;background:#05070b;}

  #hud{position:absolute;left:0;right:0;bottom:0;z-index:10;pointer-events:none;
    padding:10px 14px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
    background:linear-gradient(180deg,transparent,rgba(4,7,11,.8) 55%);}
  .stat{display:flex;align-items:center;gap:9px;}
  .meter{width:140px;}
  .meter .lbl{font-size:11px;letter-spacing:2px;color:var(--dim);font-weight:700;}
  .meter .barwrap{height:13px;background:#0c141d;border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-top:2px;}
  .meter .bar{height:100%;width:100%;transition:width .12s linear;}
  .meter .bar.hp{background:linear-gradient(90deg,#ff5a5a,#c21c1c);}
  .meter .bar.ar{background:linear-gradient(90deg,#5ac8ff,#1c74c2);}
  .meter .num{font-size:26px;font-weight:800;line-height:.9;font-variant-numeric:tabular-nums;}
  .num.hp{color:var(--hp);} .num.ar{color:var(--armor);}

  #center{display:flex;flex-direction:column;align-items:center;gap:6px;}
  #weapons{display:flex;gap:5px;align-items:flex-end;justify-content:center;flex-wrap:wrap;max-width:46vw;}
  .slot{width:40px;height:34px;border:1px solid var(--line);border-radius:5px;background:rgba(10,16,24,.7);
    display:grid;place-items:center;position:relative;font-size:15px;opacity:.35;transition:.1s;}
  .slot.have{opacity:.85;}
  .slot.active{opacity:1;border-color:var(--accent);box-shadow:0 0 10px rgba(255,106,43,.5);background:rgba(40,24,14,.85);}
  .slot .k{position:absolute;top:-1px;left:3px;font-size:9px;color:var(--dim);}

  #ammoTypes{display:flex;gap:12px;font-size:12px;font-weight:700;color:var(--dim);}
  #ammoTypes span b{color:var(--ammo);font-variant-numeric:tabular-nums;}
  #ammoTypes span.low b{color:var(--hp);}

  #ammo{text-align:right;min-width:120px;}
  #ammo .big{font-size:38px;font-weight:800;line-height:.85;color:var(--ammo);font-variant-numeric:tabular-nums;}
  #ammo .lbl{font-size:11px;letter-spacing:2px;color:var(--dim);font-weight:700;}
  #ammo .wname{font-size:14px;color:var(--ink);font-weight:800;letter-spacing:1px;}

  #top{position:absolute;top:0;left:0;right:0;z-index:10;pointer-events:none;
    display:flex;justify-content:space-between;align-items:center;padding:9px 14px;
    background:linear-gradient(180deg,rgba(4,7,11,.7),transparent);font-weight:700;}
  #top .wave{font-size:14px;letter-spacing:2px;color:var(--accent);}
  #top .score{font-size:14px;letter-spacing:1px;}
  #top .enemies{font-size:13px;color:var(--hp);letter-spacing:1px;}
  #mini{position:absolute;top:42px;right:12px;z-index:10;border:1px solid var(--line);border-radius:6px;background:rgba(6,10,15,.7);pointer-events:none;}

  #touch{position:absolute;inset:0;z-index:9;display:none;}
  #touch.on{display:block;}
  #fireBtn{position:absolute;right:22px;bottom:110px;width:88px;height:88px;border-radius:50%;
    border:2px solid #7a3b2b;background:radial-gradient(circle at 40% 35%,#4a2214,#1c0d08);
    color:#ffd0b0;font-weight:800;font-size:13px;display:grid;place-items:center;pointer-events:auto;}
  #jub{position:absolute;left:26px;bottom:110px;width:110px;height:110px;border-radius:50%;
    border:2px solid #2b465f;background:rgba(12,22,34,.5);pointer-events:auto;}
  #jub .nub{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(120,160,200,.5);}
  #swBtn{position:absolute;right:22px;bottom:210px;width:60px;height:42px;border-radius:8px;
    border:1px solid var(--line);background:rgba(12,22,34,.7);color:var(--dim);font-weight:800;font-size:12px;display:grid;place-items:center;pointer-events:auto;}

  #ov{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:rgba(3,5,9,.72);backdrop-filter:blur(3px);text-align:center;padding:20px;}
  #ov.hidden{display:none;}
  .card{width:min(600px,94vw);background:linear-gradient(180deg,#0d141d,#080d14);
    border:1.5px solid #223447;border-radius:16px;padding:28px 26px;box-shadow:0 20px 70px rgba(0,0,0,.7);position:relative;overflow:hidden;}
  .card:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,transparent,transparent 3px,rgba(255,106,43,.025) 4px);}
  .eyebrow{font-size:12px;letter-spacing:4px;color:var(--accent);font-weight:800;}
  .htitle{font-size:36px;font-weight:800;letter-spacing:2px;margin:6px 0 10px;}
  .htitle.dead{color:var(--hp);} .htitle.win{color:#57e08a;}
  .lead{font-size:15px;line-height:1.55;color:#c6d4e4;margin-bottom:8px;}
  .lead .g{color:#57e08a;font-weight:700;} .lead .r{color:var(--hp);font-weight:700;} .lead .a{color:var(--ammo);font-weight:700;}
  .bestiary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0;text-align:left;}
  .mon{background:#0c141d;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;}
  .mon .mn{font-weight:800;color:#ff8a6a;font-size:13px;}
  .mon .md{color:var(--dim);}
  .keys{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:14px 0 20px;}
  .key{font-size:12px;color:#aebfd2;background:#0c141d;border:1px solid var(--line);border-radius:6px;padding:6px 10px;}
  .key b{color:#fff;}
  .go{display:inline-block;padding:14px 40px;border:none;border-radius:12px;cursor:pointer;
    background:linear-gradient(180deg,#ff7d3c,#e2531c);color:#1c0a03;font-size:20px;font-weight:900;letter-spacing:2px;
    box-shadow:0 6px 0 #a83a11,0 12px 26px rgba(0,0,0,.45);pointer-events:auto;}
  .go:active{transform:translateY(3px);box-shadow:0 3px 0 #a83a11;}
  .sub{margin-top:12px;font-size:12px;color:var(--dim);}
  #dmg{position:absolute;inset:0;z-index:8;pointer-events:none;}
  #pickupMsg{position:absolute;left:50%;top:62%;transform:translateX(-50%);z-index:11;pointer-events:none;
    font-weight:800;font-size:15px;color:#57e08a;text-shadow:0 2px 6px #000;opacity:0;transition:opacity .2s;}
  @media (max-width:640px){ .htitle{font-size:26px} #ammo .big{font-size:28px} .meter{width:92px} .bestiary{grid-template-columns:repeat(2,1fr)} #ammoTypes{gap:7px;font-size:11px} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="dmg"></div>
  <div id="pickupMsg"></div>

  <div id="top">
    <div class="wave" id="uiWave">WAVE 1</div>
    <div class="score" id="uiScore">SCORE 0</div>
    <div class="enemies" id="uiEnemies">HOSTILES 0</div>
  </div>
  <canvas id="mini" width="120" height="120"></canvas>

  <div id="hud">
    <div class="stat">
      <div class="num hp" id="uiHP">100</div>
      <div class="meter"><div class="lbl">HEALTH</div><div class="barwrap"><div class="bar hp" id="barHP"></div></div></div>
    </div>
    <div id="center">
      <div id="ammoTypes"></div>
      <div id="weapons"></div>
    </div>
    <div id="ammo">
      <div class="wname" id="uiWName">CHAINGUN</div>
      <div class="big" id="uiAmmo">200</div>
      <div class="lbl">AMMO</div>
    </div>
    <div class="stat">
      <div class="meter"><div class="lbl" style="text-align:right">ARMOR</div><div class="barwrap"><div class="bar ar" id="barAR"></div></div></div>
      <div class="num ar" id="uiAR">50</div>
    </div>
  </div>

  <div id="touch">
    <div id="jub"><div class="nub" id="nub"></div></div>
    <div id="swBtn">SWAP</div>
    <div id="fireBtn">FIRE</div>
  </div>

  <div id="ov"><div class="card" id="card"></div></div>
</div>

<script>
"use strict";
/* =========================================================================
   BREACH PROTOCOL — raycasting FPS with a Doom-derived bestiary + arsenal.
   Baseline researched from classic Doom (id Software, 1993) and rescaled:
   hitscan vs projectile monsters, pain-state stun, monster infighting,
   splash-damage rockets, ammo-by-type. Single file, procedural assets.
   ========================================================================= */

/* ---------- display + internal render buffer ---------- */
const disp=document.getElementById('c'), dctx=disp.getContext('2d');
const rc=document.createElement('canvas'), rctx=rc.getContext('2d');
let W=0,H=0,RW=0,RH=0,DPR=Math.min(2,window.devicePixelRatio||1);
function resize(){
  W=innerWidth;H=innerHeight;
  disp.width=W*DPR;disp.height=H*DPR;dctx.setTransform(DPR,0,0,DPR,0,0);
  RW=Math.min(560,Math.round(W*(W<700?0.7:0.5))); RH=Math.round(RW*H/W);
  rc.width=RW;rc.height=RH; rctx.imageSmoothingEnabled=false; dctx.imageSmoothingEnabled=false;
}
addEventListener('resize',resize); resize();

/* ---------- map ---------- */
const MAP=[
 "1111111111111111111111",
 "1000000000022200000031",
 "1011110000000000011031",
 "1010010000330000010001",
 "1010010000330000010001",
 "1010011110000001110001",
 "1000000000000000000001",
 "1000004440000044400001",
 "1000004000000004000001",
 "1000004000550004000001",
 "1000000000550000000001",
 "1000004000550004000001",
 "1000004000000004000001",
 "1000004440000044400001",
 "1000000000000000000001",
 "1011111000000000111101",
 "1010001000330000100101",
 "1010001000330000100101",
 "1000001000000000000001",
 "1220000000000000002231",
 "1111111111111111111111"];
const MH=MAP.length,MW=MAP[0].length;
const cell=(x,y)=>(x<0||y<0||x>=MW||y>=MH)?1:(MAP[y|0].charCodeAt(x|0)-48);

/* ---------- wall textures ---------- */
const TS=64;
function tex(fn){const t=document.createElement('canvas');t.width=t.height=TS;fn(t.getContext('2d'));return t;}
const TEX={};
TEX[1]=tex(g=>{g.fillStyle='#3a4048';g.fillRect(0,0,TS,TS);for(let y=0;y<TS;y+=16)for(let x=0;x<TS;x+=32){g.fillStyle='#2c3138';g.fillRect(x+((y/16)%2?16:0),y,30,14);}g.fillStyle='rgba(255,255,255,.05)';g.fillRect(0,0,TS,2);});
TEX[2]=tex(g=>{g.fillStyle='#20242a';g.fillRect(0,0,TS,TS);for(let i=-TS;i<TS;i+=18){g.fillStyle='#e6791f';g.beginPath();g.moveTo(i,0);g.lineTo(i+9,0);g.lineTo(i+9-TS,TS);g.lineTo(i-TS,TS);g.fill();}g.fillStyle='rgba(0,0,0,.25)';g.fillRect(0,0,TS,6);g.fillRect(0,TS-6,TS,6);});
TEX[3]=tex(g=>{g.fillStyle='#1c2733';g.fillRect(0,0,TS,TS);g.strokeStyle='#2f4a63';g.lineWidth=2;g.strokeRect(4,4,TS-8,TS-8);g.fillStyle='#37b6ff';for(let i=0;i<4;i++)g.fillRect(10+i*13,TS-14,7,7);g.fillStyle='#0f3a55';g.fillRect(10,10,TS-20,18);});
TEX[4]=tex(g=>{g.fillStyle='#4a3a2c';g.fillRect(0,0,TS,TS);for(let i=0;i<80;i++){g.fillStyle=`rgba(${90+Math.random()*60|0},${50+Math.random()*40|0},20,.5)`;g.fillRect(Math.random()*TS,Math.random()*TS,3,3);}g.fillStyle='#2c2118';g.fillRect(0,0,4,TS);g.fillRect(TS-4,0,4,TS);});
TEX[5]=tex(g=>{g.fillStyle='#12060a';g.fillRect(0,0,TS,TS);const grd=g.createRadialGradient(TS/2,TS/2,4,TS/2,TS/2,TS/2);grd.addColorStop(0,'#ffdf6b');grd.addColorStop(.4,'#ff5a2b');grd.addColorStop(1,'#5a1206');g.fillStyle=grd;g.fillRect(4,4,TS-8,TS-8);g.strokeStyle='#1a0a06';g.lineWidth=3;g.strokeRect(2,2,TS-4,TS-4);});

/* ======================= BESTIARY (Doom-derived) ======================= */
/* HP/behavior rescaled from classic Doom. atk: hitscan | spread | proj | melee */
const BESTIARY={
  zombie:    {hp:25,  speed:0.020,r:0.3, atk:'hitscan',dmg:5, cd:60, want:6, pain:0.85,melee:0, score:100, sound:[300,0.05], name:"ZOMBIEMAN"},
  shotgunner:{hp:40,  speed:0.020,r:0.3, atk:'spread', dmg:4, cd:80, want:6, pain:0.70,melee:0, score:160, sound:[180,0.08], name:"SHOTGUN GUY"},
  imp:       {hp:60,  speed:0.028,r:0.3, atk:'proj',proj:'imp',  cd:64, want:8, pain:0.70,melee:9, score:220, sound:[420,0.06], name:"IMP", h:1.35},
  pinky:     {hp:150, speed:0.050,r:0.35,atk:'melee', dmg:14,cd:32, want:1.3,pain:0.45,melee:14,score:280, sound:[140,0.1],  name:"PINKY", h:1.1, wide:1.35},
  caco:      {hp:400, speed:0.021,r:0.45,atk:'proj',proj:'caco', cd:58, want:10,pain:0.30,melee:16,score:500, float:1, sound:[220,0.12], name:"CACODEMON", h:1.0, wide:1.0},
  baron:     {hp:1000,speed:0.022,r:0.5, atk:'proj',proj:'baron',cd:60, want:12,pain:0.12,melee:22,score:1200,sound:[110,0.16], name:"BARON OF HELL", h:1.5},
};
/* projectile archetypes */
const PROJDEF={
  imp:   {speed:0.16,dmg:14,r:0.22,color:'#ff8a2b',glow:'#ffd060',splash:0},
  caco:  {speed:0.15,dmg:20,r:0.24,color:'#c840ff',glow:'#f0a0ff',splash:0},
  baron: {speed:0.17,dmg:28,r:0.26,color:'#57e08a',glow:'#c8ffd8',splash:0},
  rocket:{speed:0.24,dmg:90,r:0.22,color:'#dddddd',glow:'#ffb060',splash:2.4},
  plasma:{speed:0.42,dmg:24,r:0.16,color:'#37b6ff',glow:'#bfe8ff',splash:0},
  bfg:   {speed:0.28,dmg:340,r:0.5,color:'#7dff5a',glow:'#e0ffcf',splash:3.6},
};

/* ---------- enemy sprite factory ---------- */
function enemySprite(kind,hurt){
  const s=64,ht=Math.round(s*(BESTIARY[kind].h||1.35)),t=document.createElement('canvas');
  t.width=s;t.height=ht;const g=t.getContext('2d');
  const flash=hurt;
  const shade=(base)=> flash? '#ffd6c6' : base;
  if(kind==='zombie'||kind==='shotgunner'){
    const suit = kind==='zombie'? '#5f6b3a':'#33383e';
    g.fillStyle='#241a12';g.fillRect(s*0.34,s*1.0,s*0.12,ht-s*1.0);g.fillRect(s*0.54,s*1.0,s*0.12,ht-s*1.0);
    g.fillStyle=shade(suit);g.beginPath();g.moveTo(s*0.3,s*0.5);g.lineTo(s*0.7,s*0.5);g.lineTo(s*0.66,s*1.02);g.lineTo(s*0.34,s*1.02);g.fill();
    g.fillStyle=shade('#caa98a');g.beginPath();g.arc(s*0.5,s*0.4,s*0.15,0,7);g.fill();
    g.fillStyle='#3a1010';g.fillRect(s*0.42,s*0.38,s*0.06,s*0.05);g.fillRect(s*0.52,s*0.38,s*0.06,s*0.05);
    g.fillStyle='#15181c';g.fillRect(s*0.60,s*0.66,s*0.34,s*0.09); // gun
    if(kind==='shotgunner'){g.fillRect(s*0.60,s*0.60,s*0.34,s*0.06);}
  } else if(kind==='imp'){
    g.fillStyle=shade('#7a4326');
    g.fillRect(s*0.34,s*1.0,s*0.12,ht-s*1.0);g.fillRect(s*0.54,s*1.0,s*0.12,ht-s*1.0);
    g.beginPath();g.moveTo(s*0.28,s*0.48);g.lineTo(s*0.72,s*0.48);g.lineTo(s*0.64,s*1.02);g.lineTo(s*0.36,s*1.02);g.fill();
    g.beginPath();g.arc(s*0.5,s*0.36,s*0.16,0,7);g.fill();
    // spikes
    g.fillStyle=shade('#5a2e18');for(let i=0;i<5;i++){g.beginPath();g.moveTo(s*(0.3+i*0.1),s*0.5);g.lineTo(s*(0.34+i*0.1),s*0.4);g.lineTo(s*(0.38+i*0.1),s*0.5);g.fill();}
    g.fillStyle=flash?'#fff':'#ffcf3b';g.fillRect(s*0.42,s*0.33,s*0.05,s*0.05);g.fillRect(s*0.53,s*0.33,s*0.05,s*0.05);
    // glowing hands
    g.fillStyle=flash?'#fff':'#ff7a2b';g.shadowColor='#ff7a2b';g.shadowBlur=8;
    g.beginPath();g.arc(s*0.22,s*0.7,s*0.07,0,7);g.arc(s*0.78,s*0.7,s*0.07,0,7);g.fill();g.shadowBlur=0;
  } else if(kind==='pinky'){
    g.fillStyle=shade('#d46a8a');
    g.beginPath();g.ellipse(s*0.5,s*0.72,s*0.42,s*0.3,0,0,7);g.fill();
    g.fillStyle='#241a12';g.fillRect(s*0.2,s*0.95,s*0.1,ht-s*0.95);g.fillRect(s*0.7,s*0.95,s*0.1,ht-s*0.95);
    // big mouth
    g.fillStyle='#2a0a12';g.beginPath();g.ellipse(s*0.5,s*0.74,s*0.26,s*0.16,0,0,7);g.fill();
    g.fillStyle='#fff';for(let i=0;i<6;i++){g.beginPath();g.moveTo(s*(0.28+i*0.09),s*0.62);g.lineTo(s*(0.32+i*0.09),s*0.74);g.lineTo(s*(0.36+i*0.09),s*0.62);g.fill();}
    g.fillStyle=flash?'#fff':'#7a1020';g.fillRect(s*0.34,s*0.5,s*0.08,s*0.06);g.fillRect(s*0.58,s*0.5,s*0.08,s*0.06);
  } else if(kind==='caco'){
    const grd=g.createRadialGradient(s*0.5,s*0.5,4,s*0.5,s*0.55,s*0.5);
    grd.addColorStop(0,flash?'#ffd0d0':'#e05050');grd.addColorStop(1,flash?'#ff9a9a':'#7a1818');
    g.fillStyle=grd;g.beginPath();g.arc(s*0.5,s*0.55,s*0.44,0,7);g.fill();
    // horns
    g.fillStyle=shade('#4a1010');g.beginPath();g.moveTo(s*0.3,s*0.2);g.lineTo(s*0.4,s*0.32);g.lineTo(s*0.22,s*0.34);g.fill();
    g.beginPath();g.moveTo(s*0.7,s*0.2);g.lineTo(s*0.6,s*0.32);g.lineTo(s*0.78,s*0.34);g.fill();
    // eye
    g.fillStyle='#fff';g.beginPath();g.arc(s*0.5,s*0.5,s*0.13,0,7);g.fill();
    g.fillStyle=flash?'#f88':'#1a6adf';g.beginPath();g.arc(s*0.5,s*0.5,s*0.06,0,7);g.fill();
    // mouth
    g.fillStyle='#2a0808';g.beginPath();g.ellipse(s*0.5,s*0.78,s*0.2,s*0.09,0,0,7);g.fill();
    g.fillStyle='#fff';for(let i=0;i<5;i++)g.fillRect(s*(0.33+i*0.08),s*0.72,s*0.03,s*0.06);
  } else if(kind==='baron'){
    g.fillStyle=shade('#c9a3ad');
    g.fillRect(s*0.32,s*1.02,s*0.14,ht-s*1.02);g.fillRect(s*0.54,s*1.02,s*0.14,ht-s*1.02);
    g.beginPath();g.moveTo(s*0.26,s*0.42);g.lineTo(s*0.74,s*0.42);g.lineTo(s*0.66,s*1.04);g.lineTo(s*0.34,s*1.04);g.fill();
    g.fillStyle=shade('#8a5a6a');g.beginPath();g.arc(s*0.5,s*0.3,s*0.17,0,7);g.fill();
    // horns
    g.fillStyle=shade('#e8d8dd');g.beginPath();g.moveTo(s*0.34,s*0.16);g.lineTo(s*0.42,s*0.28);g.lineTo(s*0.3,s*0.28);g.fill();
    g.beginPath();g.moveTo(s*0.66,s*0.16);g.lineTo(s*0.58,s*0.28);g.lineTo(s*0.7,s*0.28);g.fill();
    g.fillStyle=flash?'#fff':'#ff3020';g.fillRect(s*0.42,s*0.28,s*0.05,s*0.05);g.fillRect(s*0.53,s*0.28,s*0.05,s*0.05);
    // green plasma hands
    g.fillStyle=flash?'#fff':'#57e08a';g.shadowColor='#57e08a';g.shadowBlur=10;

let AC=null;function ac(){if(!AC){try{AC=new(AudioContext||webkitAudioContext)();}catch(e){}}return AC;}
function snd(freq,dur,type,vol){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();

  g.gain.setValueAtTime(vol||0.05,a.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);

/* ---------- line of sight ---------- */
function los(ax,ay,bx,by){const dx=bx-ax,dy=by-ay,d=Math.hypot(dx,dy);const st=d/0.1;
  for(let i=1;i<st;i++){const t=i/st;if(cell(ax+dx*t,ay+dy*t)>0)return false;}return true;}

function tryFire(){

function hitscan(angle,w){
  const dx=Math.cos(angle),dy=Math.sin(angle);
  let wallDist=w.range;
  for(let t=0.1;t<w.range;t+=0.05){if(cell(P.x+dx*t,P.y+dy*t)>0){wallDist=t;break;}}
  let best=null,bestT=1e9;
  for(const e of enemies){if(e.dead)continue;
    const ex=e.x-P.x,ey=e.y-P.y,proj=ex*dx+ey*dy; if(proj<=0||proj>wallDist)continue;
    const perp=Math.abs(ex*dy-ey*dx); if(perp>e.def.r+0.05)continue;
    if(proj<bestT){bestT=proj;best=e;}}
  tracers.push({x1:P.x+dx*0.4,y1:P.y+dy*0.4,x2:P.x+dx*(best?bestT:wallDist),y2:P.y+dy*(best?bestT:wallDist),life:3});
  if(best)hurtEnemy(best,w.dmg,dx,dy,null);
}
function hurtEnemy(e,dmg,dx,dy,attacker){
  e.hp-=dmg; spawnBlood(e.x,e.y); e.hurtT=5;
  if(dx!=null){e.x+=dx*0.05;e.y+=dy*0.05;}
  if(Math.random()<e.def.pain){e.pain=10;} // pain-state stun
  if(attacker){e.target=attacker;} // infighting: retaliate against attacker
  if(e.hp<=0&&!e.dead){e.dead=true;e.deathT=0;score+=e.def.score;snd(e.def.sound[0]*0.6,0.22,'square',0.06);if(Math.random()<0.4)dropPickup(e.x,e.y);}
}

function spawnProjectile(x,y,angle,type,owner,shooter){
  const d=PROJDEF[type];
  projectiles.push({x,y,vx:Math.cos(angle)*d.speed,vy:Math.sin(angle)*d.speed,type,owner,shooter,life:200,def:d});
}
function splash(x,y,radius,dmg,hitPlayer){
  for(const e of enemies){if(e.dead)continue;const d=Math.hypot(e.x-x,e.y-y);if(d<radius)hurtEnemy(e,dmg*(1-d/radius),null,null,null);}
  if(hitPlayer){const d=Math.hypot(P.x-x,P.y-y);if(d<radius)damagePlayer(dmg*(1-d/radius)*0.5);}
  for(let i=0;i<18;i++)blood.push({x:x+(Math.random()-.5)*0.5,y:y+(Math.random()-.5)*0.5,z:Math.random(),vx:(Math.random()-.5)*0.08,vy:(Math.random()-.5)*0.08,life:20,boom:1});
}
function updateProjectiles(){
  for(const pr of projectiles){
    for(let s=0;s<2;s++){ // substep for fast projectiles
      pr.x+=pr.vx/2; pr.y+=pr.vy/2; pr.life--;
      if(cell(pr.x,pr.y)>0){ detonate(pr); break; }
      if(pr.owner==='player'){
        let hit=null;for(const e of enemies){if(e.dead)continue;if(Math.hypot(e.x-pr.x,e.y-pr.y)<e.def.r+pr.def.r){hit=e;break;}}
        if(hit){ if(pr.def.splash>0)detonate(pr); else {hurtEnemy(hit,pr.def.dmg,pr.vx,pr.vy,null);pr.dead=true;} break; }
      } else { // enemy projectile
        if(Math.hypot(P.x-pr.x,P.y-pr.y)<0.4){ damagePlayer(pr.def.dmg); pr.dead=true; break; }
        // infighting: enemy projectile striking another enemy
        let hit=null;for(const e of enemies){if(e.dead||e===pr.shooter)continue;if(Math.hypot(e.x-pr.x,e.y-pr.y)<e.def.r+pr.def.r){hit=e;break;}}
        if(hit){ hurtEnemy(hit,pr.def.dmg,pr.vx,pr.vy,pr.shooter); pr.dead=true; break; }
      }
    }
    if(pr.life<=0)pr.dead=true;
  }
  projectiles=projectiles.filter(p=>!p.dead);
}
function detonate(pr){ pr.dead=true;
  if(pr.def.splash>0){ splash(pr.x,pr.y,pr.def.splash,pr.def.dmg,pr.owner==='player'); snd(70,0.2,'square',0.07); shakeScreen(pr.type==='bfg'?26:12); }

}

/* ---------- spawning / waves ---------- */
function spawnPts(){return [[2,2],[19,2],[2,18],[19,18],[11,2],[11,18],[2,10],[19,10]].filter(p=>cell(p[0],p[1])===0);}
function waveComposition(n){
  const list=[];
  const add=(k,c)=>{for(let i=0;i<c;i++)list.push(k);};
  add('zombie', 3+Math.max(0,4-n));
  add('imp', 1+Math.floor(n*0.8));
  if(n>=2)add('shotgunner',1+Math.floor(n*0.5));
  if(n>=3)add('pinky',Math.floor(n*0.5));
  if(n>=4)add('caco',Math.floor((n-3)*0.7));
  if(n>=5&&n%2===1)add('baron',Math.floor((n-3)/2));
  return list;
}
function startWave(n){enemies.length=0;projectiles.length=0;spawnQueue=waveComposition(n);spawnTimer=0;updateHUD();}
function spawnOne(kind){
  const pts=spawnPts();const p=pts[Math.floor(Math.random()*pts.length)]||[2,2];
  const def=BESTIARY[kind];
  enemies.push({kind,def,x:p[0]+0.5,y:p[1]+0.5,hp:def.hp,max:def.hp,pain:0,atkCd:Math.floor(Math.random()*40),
    hurtT:0,dead:false,deathT:0,target:'player',windup:0});
}

/* ---------- update ---------- */
function update(){
  if(!running||over)return;
  const w=WEAPONS[P.w];
  // movement
  let fwd=0,strafe=0;
  if(keys['w']||keys['arrowup'])fwd+=1; if(keys['s']||keys['arrowdown'])fwd-=1;
  if(keys['a'])strafe-=1; if(keys['d'])strafe+=1;
  if(keys['arrowleft'])P.a-=0.045; if(keys['arrowright'])P.a+=0.045;
  if(isTouch){fwd=-moveVec.y;strafe=moveVec.x;}
  const dx=Math.cos(P.a),dy=Math.sin(P.a),spd=0.058;
  let mx=dx*fwd-dy*strafe,my=dy*fwd+dx*strafe;const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
  const nx=P.x+mx*spd,ny=P.y+my*spd;
  if(cell(nx,P.y)===0)P.x=nx; if(cell(P.x,ny)===0)P.y=ny;
  if(ml>0.05)P.bob+=0.25;else P.bob*=0.8;
  // firing
  if(mouseDown){ if(w.auto||(P.cool<=0&&!P.held))tryFire(); if(!w.auto)P.held=true; } else P.held=false;
  if(P.cool>0)P.cool--; if(P.flash>0)P.flash--; if(P.recoil>0)P.recoil--; if(P.hurt>0)P.hurt--;
  // spawn
  if(spawnQueue.length>0){spawnTimer--;if(spawnTimer<=0){spawnOne(spawnQueue.shift());spawnTimer=Math.max(24,70-wave*4);}}
  // enemies
  for(const e of enemies){
    if(e.dead){e.deathT++;continue;}
    if(e.pain>0){e.pain--;continue;} // stunned, skip turn
    if(e.hurtT>0)e.hurtT--;
    // resolve target
    let tx=P.x,ty=P.y,tgt='player';
    if(e.target!=='player'){ if(e.target.dead){e.target='player';} else {tx=e.target.x;ty=e.target.y;tgt=e.target;} }
    const ddx=tx-e.x,ddy=ty-e.y,d=Math.hypot(ddx,ddy)||1;
    const seeTarget=los(e.x,e.y,tx,ty);
    // movement: approach to preferred range, melee always closes
    const want=e.def.want;
    let mv=0; if(d>want||e.def.atk==='melee')mv=e.def.speed; else if(d<want*0.55)mv=-e.def.speed*0.6;
    if(mv!==0){const vx=ddx/d*mv,vy=ddy/d*mv;
      // wander a bit if no LOS
      if(cell(e.x+vx,e.y)===0)e.x+=vx; else e.x-=vy*0.5;
      if(cell(e.x,e.y+vy)===0)e.y+=vy; else e.y+=vx*0.5;}
    // attack
    e.atkCd--;
    if(e.windup>0){ e.windup--; if(e.windup===0){ doAttack(e,tx,ty,d,tgt); } }
    else if(e.atkCd<=0 && seeTarget){
      if(e.def.atk==='melee'){ if(d<e.def.r+0.9){e.windup=8;e.atkCd=e.def.cd;} }
      else if(d<=e.def.want+3){ e.windup=e.def.atk==='proj'?12:8; e.atkCd=e.def.cd; }
      else if(e.def.melee&&d<e.def.r+0.9){ e.windup=8;e.atkCd=e.def.cd; }
    }
  }
  enemies=enemies.filter(e=>!(e.dead&&e.deathT>16));
  updateProjectiles();
  // pickups
  for(const p of pickups){p.t++;if(Math.hypot(P.x-p.x,P.y-p.y)<0.5){collect(p);p.dead=true;}}
  pickups=pickups.filter(p=>!p.dead);
  // blood
  for(const b of blood){b.x+=b.vx;b.y+=b.vy;b.life--;}
  blood=blood.filter(b=>b.life>0);
  for(const t of tracers)t.life--; tracers=tracers.filter(t=>t.life>0);
  if(shake>0)shake*=0.86;
  if(msgT>0){msgT--;if(msgT===0)document.getElementById('pickupMsg').style.opacity='0';}
  // flow
  if(spawnQueue.length===0&&enemies.filter(e=>!e.dead).length===0)waveClear();
  if(P.hp<=0)die();
  updateHUD();
}
function doAttack(e,tx,ty,d,tgt){
  const ang=Math.atan2(ty-e.y,tx-e.x);
  if(!los(e.x,e.y,tx,ty))return;
  if(e.def.atk==='melee' || (e.def.melee && d<e.def.r+1.0)){
    const dmg = e.def.atk==='melee'? e.def.dmg : e.def.melee;
    if(tgt==='player')damagePlayer(dmg); else hurtEnemy(tgt,dmg,null,null,e);
    snd(e.def.sound[0],0.08,'square',0.05);
  } else if(e.def.atk==='hitscan'){
    if(tgt==='player')damagePlayer(e.def.dmg); else hurtEnemy(tgt,e.def.dmg,null,null,e);
    tracers.push({x1:e.x,y1:e.y,x2:tx,y2:ty,life:3,enemy:1});snd(e.def.sound[0],0.05,'square',0.04);
  } else if(e.def.atk==='spread'){
    for(let i=-1;i<=1;i++){ if(Math.random()<0.7){ if(tgt==='player')damagePlayer(e.def.dmg); else hurtEnemy(tgt,e.def.dmg,null,null,e);} }
    tracers.push({x1:e.x,y1:e.y,x2:tx,y2:ty,life:3,enemy:1});snd(e.def.sound[0],0.08,'square',0.05);
  } else if(e.def.atk==='proj'){
    spawnProjectile(e.x+Math.cos(ang)*0.4,e.y+Math.sin(ang)*0.4,ang,e.def.proj,'enemy',e);
    snd(e.def.sound[0],0.06,'square',0.05);
  }
}

/* ======================= RENDER ======================= */
function render(){
  const ox=(Math.random()-0.5)*shake,oy=(Math.random()-0.5)*shake;
  // ceiling + floor
  const g1=rctx.createLinearGradient(0,0,0,RH/2);g1.addColorStop(0,'#0a1017');g1.addColorStop(1,'#1a2530');
  rctx.fillStyle=g1;rctx.fillRect(0,0,RW,RH/2+2);
  const g2=rctx.createLinearGradient(0,RH/2,0,RH);g2.addColorStop(0,'#241f18');g2.addColorStop(1,'#0c0a07');
  rctx.fillStyle=g2;rctx.fillRect(0,RH/2,RW,RH/2+2);

  const dirX=Math.cos(P.a),dirY=Math.sin(P.a),planeX=-dirY*0.66,planeY=dirX*0.66;
  const horizon=RH/2+(P.hurt>0?(Math.random()-0.5)*5:0)+oy*0.2;

  for(let x=0;x<RW;x++){
    const camX=2*x/RW-1,rdx=dirX+planeX*camX,rdy=dirY+planeY*camX;
    let mapX=P.x|0,mapY=P.y|0;const ddx=Math.abs(1/rdx),ddy=Math.abs(1/rdy);
    let stepX,stepY,sdx,sdy;
    if(rdx<0){stepX=-1;sdx=(P.x-mapX)*ddx;}else{stepX=1;sdx=(mapX+1-P.x)*ddx;}
    if(rdy<0){stepY=-1;sdy=(P.y-mapY)*ddy;}else{stepY=1;sdy=(mapY+1-P.y)*ddy;}
    let side=0,hit=0,tile=1,guard=0;
    while(!hit&&guard++<64){if(sdx<sdy){sdx+=ddx;mapX+=stepX;side=0;}else{sdy+=ddy;mapY+=stepY;side=1;}tile=cell(mapX,mapY);if(tile>0)hit=1;}
    const perp=side===0?(sdx-ddx):(sdy-ddy);zbuf[x]=perp;
    const lineH=Math.round(RH/perp),dStart=Math.round(-lineH/2+horizon);
    let wallX=side===0?P.y+perp*rdy:P.x+perp*rdx;wallX-=Math.floor(wallX);
    let texX=Math.floor(wallX*TS);if(side===0&&rdx>0)texX=TS-texX-1;if(side===1&&rdy<0)texX=TS-texX-1;
    rctx.drawImage(TEX[tile]||TEX[1],texX,0,1,TS,x,dStart,1,lineH);
    let shd=side===1?0.28:0;shd+=Math.min(0.72,perp*0.045);if(tile===5)shd=Math.max(0,shd-0.3);
    if(shd>0){rctx.fillStyle=`rgba(4,6,10,${shd})`;rctx.fillRect(x,dStart,1,lineH);}
  }

  // billboards
  const sprites=[];
  for(const e of enemies)sprites.push({kind:'e',x:e.x,y:e.y,e});
  for(const p of projectiles)sprites.push({kind:'proj',x:p.x,y:p.y,p});
  for(const p of pickups)sprites.push({kind:'p',x:p.x,y:p.y,p});
  for(const b of blood)sprites.push({kind:'b',x:b.x,y:b.y,b});
  for(const s of sprites)s.d=(P.x-s.x)**2+(P.y-s.y)**2;
  sprites.sort((a,b)=>b.d-a.d);
  const invDet=1/(planeX*dirY-dirX*planeY);
  for(const s of sprites){
    const spx=s.x-P.x,spy=s.y-P.y;
    const tX=invDet*(dirY*spx-dirX*spy),tY=invDet*(-planeY*spx+planeX*spy);
    if(tY<=0.15)continue;
    const screenX=Math.round((RW/2)*(1+tX/tY));
    if(s.kind==='e'){
      const e=s.e,def=e.def,img=(e.hurtT>0||e.pain>5)?SPRITES[e.kind].hurt:SPRITES[e.kind].normal;
      const scale=(def.h||1.35), wide=(def.wide||1);
      const sH=Math.abs(RH/tY)*scale*0.9, sW=sH*(img.width/img.height)*wide;
      const floatY=(def.float?-0.25:0)*RH/tY;
      const dStartY=Math.round(-sH/2+horizon+sH*0.15+floatY);
      const dead=e.dead,squash=dead?Math.max(0.08,1-e.deathT/16):1;
      const hh=sH*squash,dsY=dStartY+sH-hh,startX=Math.round(screenX-sW/2);
      for(let col=Math.max(0,startX);col<Math.min(RW,startX+sW);col++){
        if(tY>=zbuf[col])continue;
        const txx=Math.floor((col-startX)/sW*img.width);
        rctx.drawImage(img,txx,0,1,img.height,col,dsY,1,hh);
      }
      if(!dead&&e.hp<e.max){const bw=sW*0.7,bx=screenX-bw/2,by=dStartY-4,cc=Math.min(RW-1,Math.max(0,screenX));
        if(tY<zbuf[cc]){rctx.fillStyle='#300';rctx.fillRect(bx,by,bw,2);rctx.fillStyle=e.max>500?'#ff8a2b':'#f33';rctx.fillRect(bx,by,bw*(e.hp/e.max),2);}}
    } else if(s.kind==='proj'){
      const p=s.p,cc=Math.min(RW-1,Math.max(0,screenX));if(tY>=zbuf[cc])continue;
      const sz=Math.abs(RH/tY)*p.def.r*1.2;
      const yy=horizon;
      const grd=rctx.createRadialGradient(screenX,yy,0,screenX,yy,sz);
      grd.addColorStop(0,p.def.glow);grd.addColorStop(0.5,p.def.color);grd.addColorStop(1,'rgba(0,0,0,0)');
      rctx.fillStyle=grd;rctx.beginPath();rctx.arc(screenX,yy,sz,0,7);rctx.fill();
    } else if(s.kind==='p'){
      const cc=Math.min(RW-1,Math.max(0,screenX));if(tY>=zbuf[cc])continue;
      const sz=Math.abs(RH/tY)*0.22,yy=horizon+Math.abs(RH/tY)*0.28;
      const col={hp:'#ff4d4d',armor:'#37b6ff',bullets:'#ffcf3b',shells:'#ff8a3b',rockets:'#ff5a2b',cells:'#37b6ff',weapon:'#57e08a'}[s.p.type];
      rctx.fillStyle=col;rctx.globalAlpha=0.92;rctx.beginPath();rctx.arc(screenX,yy,sz,0,7);rctx.fill();rctx.globalAlpha=1;
      rctx.fillStyle='rgba(255,255,255,.6)';rctx.fillRect(screenX-sz/3,yy-sz/4,sz*0.66,2);
    } else {
      const cc=Math.min(RW-1,Math.max(0,screenX));if(tY>=zbuf[cc])continue;
      const sz=Math.abs(RH/tY)*0.06;rctx.fillStyle=s.b.boom?`rgba(255,${140+Math.random()*80|0},40,${Math.min(1,s.b.life/20)})`:`rgba(200,20,20,${Math.min(1,s.b.life/22)})`;
      rctx.fillRect(screenX-sz/2,horizon,sz,sz);
    }
  }
  // enemy tracers (as world lines projected — simple screen approximation)
  dctx.drawImage(rc,0,0,RW,RH,ox,oy,W,H);
  drawTracers(dirX,dirY,planeX,planeY,invDet,horizon);
  drawWeapon();drawCrosshair();drawMinimap();
}
function drawTracers(dirX,dirY,planeX,planeY,invDet,horizon){
  for(const t of tracers){
    const project=(wx,wy)=>{const spx=wx-P.x,spy=wy-P.y;const tX=invDet*(dirY*spx-dirX*spy),tY=invDet*(-planeY*spx+planeX*spy);
      if(tY<=0.1)return null;return {x:(W/2)*(1+tX/tY),y:horizon/RH*H,tY};};
    const a=project(t.x1,t.y1),b=project(t.x2,t.y2);if(!a||!b)continue;
    dctx.strokeStyle=t.enemy?'rgba(255,120,60,.7)':'rgba(255,240,160,.8)';dctx.lineWidth=t.enemy?2:2.5;
    dctx.beginPath();dctx.moveTo(a.x,H/2);dctx.lineTo(b.x,H/2);dctx.stroke();
  }
}
function drawWeapon(){
  const w=WEAPONS[P.w];const bobX=Math.sin(P.bob)*10,bobY=Math.abs(Math.cos(P.bob))*8;
  const cx=W/2+bobX,base=H-6+P.recoil*1.5+bobY;
  dctx.save();
  if(P.flash>0){const fl=P.flash/6,gx=cx,gy=base-H*0.20;
    const grd=dctx.createRadialGradient(gx,gy,2,gx,gy,60*fl);
    grd.addColorStop(0,`rgba(255,240,180,${fl})`);grd.addColorStop(.5,`rgba(255,140,40,${fl*0.7})`);grd.addColorStop(1,'rgba(255,120,30,0)');
    dctx.fillStyle=grd;dctx.beginPath();dctx.arc(gx,gy,60*fl,0,7);dctx.fill();}
  const scale=Math.min(W,H)/520;dctx.translate(cx,base);dctx.scale(scale,scale);
  const c1='#232a31',c2='#141a20',c3='#3a4653';
  if(P.w===1||P.w===2){ // shotgun / SSG
    const barrels=P.w===2?2:1,gap=P.w===2?16:0;
    for(let i=0;i<barrels;i++){dctx.fillStyle=c2;dctx.fillRect(-10-gap+i*(20+gap*0),-150,20,150);}
    if(P.w===2){dctx.fillStyle=c2;dctx.fillRect(-26,-150,20,150);dctx.fillRect(6,-150,20,150);}
    dctx.fillStyle=c1;dctx.fillRect(-40,-40,80,70);dctx.fillStyle='#5a3a24';dctx.fillRect(-16,20,32,90);dctx.fillStyle='#c99';dctx.fillRect(-40,60,80,40);
  } else if(P.w===4){ // rocket
    dctx.fillStyle=c1;dctx.fillRect(-30,-140,60,140);dctx.fillStyle='#5a1a10';dctx.beginPath();dctx.arc(0,-140,16,0,7);dctx.fill();
    dctx.fillStyle=c2;dctx.fillRect(-40,-30,80,60);dctx.fillStyle='#c99';dctx.fillRect(-40,20,80,44);
  } else if(P.w===5){ // plasma
    dctx.fillStyle=c1;dctx.fillRect(-34,-120,68,120);dctx.fillStyle='#0a2a3a';dctx.fillRect(-24,-110,48,90);
    dctx.fillStyle=P.flash>0?'#bff':'#2ea6ff';dctx.fillRect(-14,-120,28,16);dctx.fillStyle='#c99';dctx.fillRect(-40,10,80,44);
  } else if(P.w===6){ // BFG
    dctx.fillStyle=c1;dctx.fillRect(-44,-130,88,130);dctx.fillStyle='#0a3a1a';dctx.fillRect(-30,-120,60,90);
    dctx.fillStyle=P.flash>0?'#dfffcf':'#57e08a';dctx.beginPath();dctx.arc(0,-120,20,0,7);dctx.fill();dctx.fillStyle='#c99';dctx.fillRect(-50,0,100,50);
  } else { // pistol / chaingun
    const bw=P.w===0?22:28,gl=P.w===0?70:130;
    dctx.fillStyle=c2;dctx.fillRect(-bw/2,-gl,bw,gl);
    if(P.w===3){dctx.fillStyle=c3;dctx.fillRect(-bw/2-6,-gl+20,6,gl-30);dctx.fillRect(bw/2,-gl+20,6,gl-30);}
    dctx.fillStyle=c1;dctx.fillRect(-bw*1.3,-40,bw*2.6,60);dctx.fillStyle=c3;dctx.fillRect(-bw*1.3,-40,bw*2.6,8);
    dctx.fillStyle=c2;dctx.fillRect(-bw*0.5,10,bw,80);dctx.fillStyle='#c99';dctx.fillRect(-bw*0.9,50,bw*1.8,40);
  }
  dctx.restore();
}
function drawCrosshair(){const cx=W/2,cy=H/2;dctx.strokeStyle='rgba(255,255,255,.75)';dctx.lineWidth=2;const g=8,l=7;
  dctx.beginPath();dctx.moveTo(cx-g-l,cy);dctx.lineTo(cx-g,cy);dctx.moveTo(cx+g,cy);dctx.lineTo(cx+g+l,cy);
  dctx.moveTo(cx,cy-g-l);dctx.lineTo(cx,cy-g);dctx.moveTo(cx,cy+g);dctx.lineTo(cx,cy+g+l);dctx.stroke();
  dctx.fillStyle='rgba(255,90,60,.9)';dctx.fillRect(cx-1,cy-1,2,2);}
function drawMinimap(){const m=document.getElementById('mini'),g=m.getContext('2d'),S=120,cs=S/MW;
  g.clearRect(0,0,S,S);g.fillStyle='rgba(6,10,15,.6)';g.fillRect(0,0,S,S);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){if(cell(x,y)>0){g.fillStyle=cell(x,y)===5?'#ff6a2b':'#2c3a49';g.fillRect(x*cs,y*cs,cs,cs);}}
  for(const e of enemies){if(e.dead)continue;g.fillStyle=e.max>500?'#ff8a2b':'#ff3b3b';g.fillRect(e.x*cs-1.5,e.y*cs-1.5,3,3);}
  for(const p of pickups){g.fillStyle='#57e08a';g.fillRect(p.x*cs-1,p.y*cs-1,2,2);}
  g.fillStyle='#ffcf3b';g.beginPath();g.arc(P.x*cs,P.y*cs,2.5,0,7);g.fill();
  g.strokeStyle='#ffcf3b';g.beginPath();g.moveTo(P.x*cs,P.y*cs);g.lineTo((P.x+Math.cos(P.a)*1.5)*cs,(P.y+Math.sin(P.a)*1.5)*cs);g.stroke();}

/* ---------- HUD ---------- */
function updateHUD(){
  document.getElementById('uiHP').textContent=Math.max(0,Math.ceil(P.hp));
  document.getElementById('uiAR').textContent=Math.max(0,Math.ceil(P.armor));
  document.getElementById('barHP').style.width=Math.max(0,P.hp)+'%';
  document.getElementById('barAR').style.width=Math.max(0,P.armor)+'%';
  const w=WEAPONS[P.w];
  document.getElementById('uiWName').textContent=w.name;
  document.getElementById('uiAmmo').textContent=w.ammo?AMMO[w.ammo]:'∞';
  const at=document.getElementById('ammoTypes');
  at.innerHTML=['bullets','shells','rockets','cells'].map(k=>{
    const low=AMMO[k]<=(k==='rockets'?2:10);
    return `<span class="${low?'low':''}">${AMMO_ICON[k]} <b>${AMMO[k]}</b></span>`;}).join('');
  document.getElementById('uiWave').textContent='WAVE '+wave;
  document.getElementById('uiScore').textContent='SCORE '+score;
  document.getElementById('uiEnemies').textContent='HOSTILES '+(enemies.filter(e=>!e.dead).length+spawnQueue.length);
}

/* ---------- flow ---------- */
const ov=document.getElementById('ov'),card=document.getElementById('card');
function show(html){card.innerHTML=html;ov.classList.remove('hidden');}
function hide(){ov.classList.add('hidden');}
function intro(){
  show(`
    <div class="eyebrow">FACILITY 07 · CONTAINMENT BREACH</div>
    <div class="htitle">BREACH PROTOCOL</div>
    <div class="lead">Hell broke containment. Six demon types are loose — each hits differently. <span class="r">Hunt them down</span>, grab their drops, and clear every wave. Watch for <span class="a">infighting</span>: their stray shots enrage each other.</div>
    <div class="bestiary">
      <div class="mon"><div class="mn">ZOMBIEMAN</div><div class="md">Hitscan chaff. Weak but instant.</div></div>
      <div class="mon"><div class="mn">SHOTGUN GUY</div><div class="md">Hitscan spread. Deadly mid-range.</div></div>
      <div class="mon"><div class="mn">IMP</div><div class="md">Throws dodgeable fireballs.</div></div>
      <div class="mon"><div class="mn">PINKY</div><div class="md">Fast melee charger. No range.</div></div>
      <div class="mon"><div class="mn">CACODEMON</div><div class="md">Floating tank. Plasma spit.</div></div>
      <div class="mon"><div class="mn">BARON OF HELL</div><div class="md">Mini-boss. 1000 HP. Green plasma.</div></div>
    </div>
    <div class="keys">
      <span class="key"><b>W A S D</b> move</span><span class="key"><b>Mouse</b> look</span>
      <span class="key"><b>Click/hold</b> fire</span><span class="key"><b>1-7 / scroll</b> weapons</span>
    </div>
    <button class="go" id="startBtn">BREACH</button>
    <div class="sub">${isTouch?'Left stick move · drag right to look · FIRE · SWAP':'Click the screen to capture the mouse. Esc releases. Rockets have splash — mind your feet.'}</div>`);
  document.getElementById('startBtn').onclick=()=>{ac();begin();};
}
function begin(){hide();
  P.x=11;P.y=6.5;P.a=Math.PI/2;P.hp=100;P.armor=50;P.w=3;P.owned=[true,true,false,true,false,false,false];
  AMMO={bullets:120,shells:20,rockets:8,cells:60};
  enemies=[];projectiles=[];pickups=[];blood=[];tracers=[];score=0;wave=1;over=false;
  startWave(wave);buildWeaponHUD();updateHUD();running=true;
  if(!isTouch&&document.pointerLockElement!==disp)disp.requestPointerLock&&disp.requestPointerLock();}
function waveClear(){running=false;P.hp=Math.min(100,P.hp+15);
  show(`<div class="eyebrow">SECTOR CLEARED</div><div class="htitle win">WAVE ${wave} DOWN</div>
    <div class="lead">Hostiles neutralized. <span class="g">+15 health</span> patched in. Score: <span class="a">${score}</span>.<br>The next wave brings heavier demons.</div>
    <button class="go" id="nextBtn">PUSH TO WAVE ${wave+1}</button><div class="sub">Reinforcements inbound.</div>`);
  document.getElementById('nextBtn').onclick=()=>{wave++;startWave(wave);running=true;hide();if(!isTouch&&document.pointerLockElement!==disp)disp.requestPointerLock&&disp.requestPointerLock();};}
function die(){if(over)return;over=true;running=false;
  show(`<div class="eyebrow">SIGNAL LOST</div><div class="htitle dead">YOU DIED</div>
    <div class="lead">The facility went dark. You reached <span class="a">Wave ${wave}</span> with <span class="a">${score}</span> points.</div>
    <button class="go" id="againBtn">REDEPLOY</button><div class="sub">Clear more next run.</div>`);
  document.getElementById('againBtn').onclick=()=>{over=false;begin();};}

/* ---------- loop ---------- */
function loop(){update();render();requestAnimationFrame(loop);}
buildWeaponHUD();updateHUD();intro();loop();
</script>
</body>
</html>
